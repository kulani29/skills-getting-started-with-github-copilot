<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Added compact styling for activity cards + participants -->
    <style>
      /* Activity grid & card */
      #activities-list { 
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
        margin-top: 0.5rem;
      }
      .activity-card {
        background: #fff;
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 6px 18px rgba(16,24,40,0.06);
        transition: transform .12s ease, box-shadow .12s ease;
      }
      .activity-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(16,24,40,0.08); }

      .activity-title { margin: 0 0 6px 0; font-size: 1.05rem; color: #0b3a66; }
      .activity-desc { margin: 0; color: #445; font-size: 0.95rem; }

      /* Participants */
      .participants { margin-top: 12px; }
      .participants strong { display: block; margin-bottom: 6px; color: #223; font-size: 0.92rem; }
      .participants-list { list-style: disc; margin: 0; padding-left: 1.2rem; color: #334; }
      .participants-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 0.92rem;
      }
      .avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: #0b69c3; color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 0.78rem; flex: 0 0 28px;
      }
      .no-participants { color: #6b7280; font-style: italic; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list" aria-live="polite">
          <!-- Replaced the simple loading text with a grid of activity cards.
               Each card now includes a "Participants" section (bulleted list).
               app.js should populate activity cards by cloning the template below
               and inserting <li> elements into .participants-list for each participant. -->
          <!-- Example static card (can be removed when your JS populates real items) -->
          <article class="activity-card" data-id="chess-club" aria-labelledby="a-chess-title">
            <h4 id="a-chess-title" class="activity-title">Chess Club</h4>
            <p class="activity-desc">Weekly strategy sessions and friendly matches.</p>
            <div class="participants" aria-label="Participants for Chess Club">
              <strong>Participants</strong>
              <ul class="participants-list">
                <li><span class="avatar">MJ</span> Michael J.</li>
                <li><span class="avatar">AS</span> A. Smith</li>
              </ul>
            </div>
          </article>

          <!-- Template for JS-driven rendering -->
          <template id="activity-template">
            <article class="activity-card" data-id="">
              <h4 class="activity-title"></h4>
              <p class="activity-desc"></p>
              <div class="participants" aria-label="">
                <strong>Participants</strong>
                <ul class="participants-list">
                  <!-- JS should append <li><span class="avatar">AB</span> Alice B.</li> entries here.
                       If there are no participants insert one <li class="no-participants">No participants yet.</li> -->
                </ul>
              </div>
            </article>
          </template>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
    <!-- Hint for implementers (no functional JS change required here):
         When your app.js renders activities, clone #activity-template,
         set data-id, fill .activity-title and .activity-desc and then:
         const ul = node.querySelector('.participants-list');
         if (participants.length === 0) ul.innerHTML = '<li class="no-participants">No participants yet.</li>';
         else participants.forEach(p => { const li = document.createElement('li'); li.innerHTML = `<span class="avatar">${p.initials}</span>${p.name}`; ul.appendChild(li); });
    -->
  </body>
</html>
